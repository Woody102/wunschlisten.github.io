<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wunschzettel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Calibri','Candara',sans-serif;background:#f0f5f0;min-height:100vh;padding:20px;color:#3a4a3a}
.container{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #d0e0d0;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{color:#4a7c59;text-align:center;margin-bottom:30px;font-size:2.3em;font-weight:400;letter-spacing:.5px}
.notice{background:#fff7e0;border:1px solid #e6cf85;color:#7a6420;padding:12px;margin-bottom:20px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.tab-btn{padding:10px 24px;background:#fff;border:1px solid #c0d5c0;font-size:1em;font-family:inherit;cursor:pointer;color:#4a7c59}
.tab-btn:hover{background:#f5faf5}
.tab-btn.active{background:#6b9d7f;color:#fff;border-color:#5a8d6f}
.intro{text-align:center;color:#5a6d5a;margin-bottom:30px;font-size:1.05em;line-height:1.7;white-space:pre-line}
.filter{background:#f8fcf8;padding:14px;border:1px solid #e0ebe0;margin-bottom:25px}
.filter label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#4a7c59}
.filter input{width:18px;height:18px;margin:0;cursor:pointer}
.cat-header{background:#6b9d7f;color:#fff;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;font-size:1.1em;margin-bottom:15px;border:1px solid #5a8d6f;user-select:none}
.cat-header .arrow{transition:transform .2s}
.cat-header.closed .arrow{transform:rotate(-90deg)}
.cat-content{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;margin-bottom:30px}
.card{background:#fff;border:1px solid #d5e5d5;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 3px 12px rgba(107,157,127,.15)}
.img-box{position:relative;height:240px;background:#fff;border-bottom:1px solid #e8f0e8;display:flex;align-items:center;justify-content:center}
.img-box img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.noimg{font-size:4em;opacity:.35}
.badge-res{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(169,90,90,.92);color:#fff;padding:12px 24px;font-size:1.2em;z-index:10;white-space:nowrap}
.badge-pri{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#ff6b9d 0%,#feca57 25%,#48dbfb 50%,#1dd1a1 75%,#ee5a6f 100%);color:#fff;padding:4px 10px;font-size:.85em;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.content{padding:20px}
.title{font-size:1.3em;font-weight:500;margin-bottom:8px;color:#3a5a3a}
.note{color:#6a7a6a;font-style:italic;margin-bottom:10px;font-size:.95em}
.price{font-size:1.25em;color:#6b9d7f;font-weight:500;margin-bottom:10px}
.link{color:#5a8d6f;display:inline-block;margin-bottom:15px}
.res-list{background:#f8fcf8;padding:10px;border:1px solid #e0ebe0;margin-bottom:15px}
.res-title{font-size:.9em;color:#5a7a5a;margin-bottom:8px}
.res-item{padding:8px;margin-bottom:8px;background:#fff;border-left:3px solid #7daa90}
.res-item:last-child{margin-bottom:0}
.res-name{font-weight:600;color:#4a7c59}
.res-detail{font-size:.9em;color:#555;margin-top:3px}
.com-toggle{background:#f8fcf8;padding:10px;border:1px solid #e0ebe0;cursor:pointer;margin-bottom:10px;text-align:center;color:#5a7a5a;user-select:none}
.com-section{display:none;margin-bottom:15px}
.com-section.show{display:block}
.com-list{background:#fafcfa;padding:10px;border:1px solid #e0ebe0;margin-bottom:10px;max-height:160px;overflow-y:auto}
.com-item{padding:8px;margin-bottom:8px;background:#fff;border-left:2px solid #8db39d}
.com-author{font-weight:600;color:#4a7c59;font-size:.9em}
.com-text{color:#555;font-size:.9em;margin-top:2px;white-space:pre-line}
.com-form{background:#f8fcf8;padding:10px;border:1px solid #e0ebe0}
select,textarea,input[type=text],input[type=number],input[type=password]{width:100%;padding:9px;border:1px solid #c5d5c5;margin-bottom:8px;font-family:inherit;background:#fff;font-size:1em}
textarea{min-height:60px;resize:vertical}
.btn{width:100%;padding:11px;background:#6b9d7f;color:#fff;border:1px solid #5a8d6f;cursor:pointer;margin-bottom:5px;font-size:1em;font-family:inherit}
.btn:hover{background:#5a8d6f}
.btn:disabled{background:#ccc;border-color:#bbb;cursor:not-allowed}
.btn-del{background:#a96a6a;border-color:#8b5a5a}
.btn-del:hover{background:#8b5a5a}
.btn-light{background:#fff;color:#4a7c59;border-color:#c5d5c5}
.btn-light:hover{background:#f5faf5}
.btn-xs{width:auto;padding:4px 10px;font-size:.85em;margin:6px 0 0}
.btn-inline{width:auto;padding:6px 12px;margin:0}
.modal{display:none;position:fixed;inset:0;background:rgba(74,124,89,.5);z-index:1000;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-box{background:#fff;padding:30px;border:1px solid #c5d5c5;max-width:420px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.modal-box h2{color:#4a7c59;font-weight:400;margin-bottom:16px}
.modal-box label{color:#4a7c59;font-weight:500;display:block;margin-bottom:6px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{margin:0}
.radio-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:400!important}
.radio-row input{width:auto;margin:0}
.err{color:#a96a6a;margin-bottom:12px;display:none}
.admin{margin-top:40px;padding:20px;background:#f8fcf8;border:1px solid #e0ebe0;display:none}
.admin.show{display:block}
.admin h2,.admin h3{color:#4a7c59;font-weight:400;margin-bottom:12px}
.admin-box{background:#fff;padding:15px;border:1px solid #e0ebe0;margin-bottom:20px}
.admin-box label{display:block;color:#4a7c59;margin:6px 0 4px}
.row{background:#fff;padding:10px 12px;border:1px solid #e0ebe0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row-col{flex-direction:column;align-items:stretch}
.check{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.check input{width:18px;height:18px;margin:0}
.gear{position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:#6b9d7f;color:#fff;border:1px solid #5a8d6f;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100}
.gear:hover{background:#5a8d6f}
.empty{color:#6a7a6a;text-align:center;padding:30px}
@media(max-width:768px){.container{padding:20px}h1{font-size:1.8em}.cat-content{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>🎁 Meine Wunschzettel</h1>
  <div id="notice"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <div class="admin" id="admin">
    <h2>Admin-Bereich</h2>

    <div class="admin-box">
      <h3>Wunschzettel verwalten</h3>
      <div id="adminLists"></div>
      <h3 style="margin-top:16px">Neuen Wunschzettel erstellen</h3>
      <input type="text" id="newListName" placeholder="Name des Wunschzettels">
      <textarea id="newListIntro" placeholder="Intro-Text"></textarea>
      <button class="btn" onclick="addList()">Wunschzettel hinzufügen</button>
    </div>

    <div class="admin-box">
      <h3>Wünsche des aktuellen Wunschzettels</h3>
      <div id="adminWishes"></div>
    </div>

    <div class="admin-box">
      <h3 id="wishFormTitle">Wunsch hinzufügen</h3>
      <input type="hidden" id="editWishId">
      <input type="text" id="wishTitle" placeholder="Titel">
      <input type="text" id="wishImage" placeholder="Bild-URL (optional)">
      <input type="text" id="wishNote" placeholder="Anmerkung">
      <label>Preis in Euro</label>
      <input type="number" id="wishPrice" min="0" step="0.01" placeholder="z. B. 24.90">
      <label class="check"><input type="checkbox" id="wishPriceVaries" onchange="togglePriceVaries()"><span>Preis verschieden (kein fester Betrag)</span></label>
      <label>Preiskategorie</label>
      <select id="wishCat">
        <option value="auto">Automatisch nach Preis</option>
        <option value="bis10">bis 10 €</option>
        <option value="10-30">10 – 30 €</option>
        <option value="30-50">30 – 50 €</option>
        <option value="50-100">50 – 100 €</option>
        <option value="ueber100">über 100 €</option>
        <option value="verschieden">Preis verschieden</option>
      </select>
      <label>Priorität</label>
      <select id="wishPri">
        <option value="0">Keine Priorität</option>
        <option value="1">⭐ Nett zu haben</option>
        <option value="2">⭐⭐ Sehr gewünscht</option>
        <option value="3">⭐⭐⭐ Herzenswunsch</option>
      </select>
      <input type="text" id="wishLink" placeholder="Shop-Link">
      <label class="check"><input type="checkbox" id="wishMulti" onchange="toggleMultiBox()"><span>Mehrfach möglich</span></label>
      <div id="multiOptionsBox" style="display:none">
        <label>Auswahlliste (eine Variante pro Zeile; leer lassen = nur freie Texteingabe)</label>
        <textarea id="wishMultiOptions" style="min-height:90px" placeholder="Brauner Teddy&#10;Weißer Hase&#10;Grüner Dino"></textarea>
      </div>
      <button class="btn" id="saveWishBtn" onclick="saveWish()">Wunsch hinzufügen</button>
      <button class="btn btn-light" id="cancelWishBtn" onclick="cancelWish()" style="display:none">Abbrechen</button>
    </div>

    <div class="admin-box">
      <h3>Namen verwalten</h3>
      <div id="adminNames"></div>
      <input type="text" id="newName" placeholder="Neuer Name" style="margin-top:10px">
      <button class="btn" onclick="addName()">Name hinzufügen</button>
    </div>
  </div>
</div>

<button class="gear" onclick="gearClick()" title="Admin-Bereich">⚙️</button>

<div class="modal" id="pwModal">
  <div class="modal-box">
    <h2>Admin-Zugang</h2>
    <div class="err" id="pwErr">Falsches Passwort!</div>
    <input type="password" id="pw" placeholder="Passwort">
    <div class="modal-btns">
      <button class="btn btn-light" onclick="closePw()">Abbrechen</button>
      <button class="btn" onclick="checkPw()">Bestätigen</button>
    </div>
  </div>
</div>

<div class="modal" id="resModal">
  <div class="modal-box">
    <h2>Wunsch vormerken</h2>
    <div class="err" id="resErr"></div>
    <label for="resName">Dein Name</label>
    <select id="resName"></select>
    <div id="detailBox" style="display:none"></div>
    <div class="modal-btns">
      <button class="btn btn-light" onclick="closeRes()">Abbrechen</button>
      <button class="btn" onclick="confirmRes()">Bestätigen</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
/* ===================== Konfiguration ===================== */
// Firebase-Konfiguration hier eintragen (Firebase Console -> Projekteinstellungen -> Web-App)
const firebaseConfig = {
  apiKey: "AIzaSyCc17Mahy-9ojprGou9zjEc21_VkF4H2jo",
  authDomain: "wunschlisten-57d79.firebaseapp.com",
  databaseURL: "https://wunschlisten-57d79-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wunschlisten-57d79",
  storageBucket: "wunschlisten-57d79.firebasestorage.app",
  messagingSenderId: "851544294154",
  appId: "1:851544294154:web:f8a766a9c6567f3ed570f3"
};

// Admin-Passwort als SHA-256-Hash (aktuell: admin123)
// Neues Passwort: Browser-Konsole (F12) -> hashPassword("neuesPasswort") -> Ergebnis hier einsetzen
const PW_HASH = "7a9630e4fc1adbb8794a5db4f719241bdfb78f5788f2df688f978fab5fba6ba7";

/* ===================== Konstanten ===================== */
const PRI = {
  0: { s: '', t: '' },
  1: { s: '⭐', t: 'Nett zu haben' },
  2: { s: '⭐⭐', t: 'Sehr gewünscht' },
  3: { s: '⭐⭐⭐', t: 'Herzenswunsch' }
};
const CATS = {
  'bis10':       { l: 'bis 10 €',          o: 1 },
  '10-30':       { l: '10 – 30 €',         o: 2 },
  '30-50':       { l: '30 – 50 €',         o: 3 },
  '50-100':      { l: '50 – 100 €',        o: 4 },
  'ueber100':    { l: 'über 100 €',        o: 5 },
  'verschieden': { l: 'Preis verschieden', o: 6 }
};

/* ===================== Zustand ===================== */
let lists = [
  { id: 1, name: 'Wunschzettel 1', intro: 'Herzlich willkommen auf meinem Wunschzettel!', wishes: [
    { id: 1, title: 'Beispiel-Artikel', image: '', note: 'Ein Beispiel', price: 50, cat: 'auto', pri: 2, link: 'https://example.com', multi: false, multiOptions: [], res: [], coms: [] }
  ]},
  { id: 2, name: 'Wunschzettel 2', intro: 'Mein zweiter Wunschzettel.', wishes: [
    { id: 1, title: 'Kuscheltiere', image: '', note: 'Mehrere möglich', price: 25, cat: 'auto', pri: 3, link: 'https://example.com', multi: true, multiOptions: ['Brauner Teddy', 'Weißer Hase', 'Grüner Dino'], res: [], coms: [] }
  ]}
];
let names = ['Anna', 'Max', 'Lisa', 'Tom'];
let curId = 1, hideRes = false, collapsed = {}, openCom = {}, isAdmin = false, resTarget = null;

let sid = 'anon';
try {
  sid = localStorage.getItem('wl_sid');
  if (!sid) { sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2); localStorage.setItem('wl_sid', sid); }
} catch (e) { sid = 's' + Math.random().toString(36).slice(2); }

/* ===================== Hilfsfunktionen ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
const fmtPrice = p => (p == null ? 'Preis verschieden' : p.toFixed(2).replace('.', ',') + ' €');
const curList = () => lists.find(l => l.id === curId) || lists[0];
const isSold = w => !w.multi && w.res.length > 0;

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getCat(w) {
  if (w.cat && CATS[w.cat]) return w.cat;      // manuell gewählt (alte Kategorien werden ignoriert -> automatisch)
  if (w.price == null) return 'verschieden';
  if (w.price <= 10) return 'bis10';
  if (w.price <= 30) return '10-30';
  if (w.price <= 50) return '30-50';
  if (w.price <= 100) return '50-100';
  return 'ueber100';
}

// Aufsteigend nach Preis, "verschieden" ans Ende
function byPrice(a, b) {
  const pa = a.price == null ? Infinity : a.price;
  const pb = b.price == null ? Infinity : b.price;
  if (pa === pb) return a.title.localeCompare(b.title, 'de');
  return pa < pb ? -1 : 1;
}

function normalize() {
  lists = toArr(lists);
  lists.forEach(l => {
    l.wishes = toArr(l.wishes);
    l.wishes.forEach(w => {
      w.res = toArr(w.res).map(r => typeof r === 'string' ? { name: r, detail: '', sid: '' } : { name: r.name || '', detail: r.detail || '', sid: r.sid || r.sessionId || '' });
      w.coms = toArr(w.coms);
      w.multiOptions = toArr(w.multiOptions);
      w.price = (typeof w.price === 'number' && !isNaN(w.price)) ? w.price : null;
      w.image = w.image || ''; w.note = w.note || ''; w.link = w.link || ''; w.pri = w.pri || 0; w.cat = w.cat || 'auto'; w.multi = !!w.multi;
    });
  });
  names = toArr(names);
  if (!lists.some(l => l.id === curId) && lists.length) curId = lists[0].id;
}

/* ===================== Firebase ===================== */
let db = null;
const fbConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('DEIN');
if (fbConfigured) {
  try { firebase.initializeApp(firebaseConfig); db = firebase.database(); }
  catch (e) { console.error('Firebase-Fehler:', e); }
}

function save() {
  if (!db) return;
  db.ref('wishlist').set({ lists, names }).catch(e => { console.error(e); alert('Speichern fehlgeschlagen: ' + e.message); });
}

function load() {
  if (!db) {
    $('notice').innerHTML = '<div class="notice">Firebase ist noch nicht eingerichtet – Änderungen werden nicht gespeichert und sind nur in dieser Ansicht sichtbar.</div>';
    normalize(); render(); return;
  }
  db.ref('wishlist').on('value', snap => {
    const d = snap.val();
    if (d) { lists = d.lists || lists; names = d.names || names; }
    normalize(); render();
  }, e => { console.error(e); $('notice').innerHTML = '<div class="notice">Verbindung zur Datenbank fehlgeschlagen.</div>'; });
}

/* ===================== Anzeige ===================== */
function render() { renderTabs(); renderContent(); if (isAdmin) renderAdmin(); }

function renderTabs() {
  $('tabs').innerHTML = lists.map(l => `<button class="tab-btn${l.id === curId ? ' active' : ''}" onclick="switchList(${l.id})">${esc(l.name)}</button>`).join('');
}
function switchList(id) { curId = id; render(); }

function renderContent() {
  const L = curList();
  if (!L) { $('content').innerHTML = ''; return; }
  let h = `<div class="intro">${esc(L.intro)}</div>
    <div class="filter"><label><input type="checkbox" ${hideRes ? 'checked' : ''} onchange="hideRes=this.checked;renderContent()"><span>Vergriffene Wünsche ausblenden</span></label></div>`;

  const groups = {};
  L.wishes.forEach(w => { if (hideRes && isSold(w)) return; (groups[getCat(w)] = groups[getCat(w)] || []).push(w); });
  const cats = Object.keys(groups).sort((a, b) => CATS[a].o - CATS[b].o);

  if (!cats.length) h += '<div class="empty">Keine Wünsche zu sehen.</div>';
  cats.forEach(c => {
    const key = L.id + '-' + c, closed = !!collapsed[key];
    const n = groups[c].length;
    h += `<div><div class="cat-header${closed ? ' closed' : ''}" onclick="toggleCat('${key}')"><span>${CATS[c].l} (${n} ${n === 1 ? 'Wunsch' : 'Wünsche'})</span><span class="arrow">▼</span></div>`;
    if (!closed) h += `<div class="cat-content">${groups[c].slice().sort(byPrice).map(w => cardHtml(L, w)).join('')}</div>`;
    h += '</div>';
  });
  $('content').innerHTML = h;
}
function toggleCat(key) { collapsed[key] = !collapsed[key]; renderContent(); }

function cardHtml(L, w) {
  const sold = isSold(w), p = PRI[w.pri || 0], ck = L.id + '-' + w.id;
  const img = w.image ? `<img src="${esc(w.image)}" alt="${esc(w.title)}" loading="lazy">` : '<div class="noimg">🎁</div>';
  const res = w.res.length ? `<div class="res-list"><div class="res-title">Vorgemerkt:</div>${w.res.map((r, i) =>
    `<div class="res-item"><div class="res-name">✓ ${esc(r.name)}</div>${r.detail ? `<div class="res-detail">${esc(r.detail)}</div>` : ''}${(isAdmin || r.sid === sid) ? `<button class="btn btn-del btn-xs" onclick="unreserve(${L.id},${w.id},${i})">Vormerkung aufheben</button>` : ''}</div>`).join('')}</div>` : '';
  const coms = w.coms.length ? `<div class="com-list">${w.coms.map(c => `<div class="com-item"><div class="com-author">${esc(c.author)}:</div><div class="com-text">${esc(c.text)}</div></div>`).join('')}</div>` : '';
  return `<div class="card">
    <div class="img-box">${img}${p.s ? `<div class="badge-pri">${p.s} ${p.t}</div>` : ''}${sold ? '<div class="badge-res">bereits vergriffen</div>' : ''}</div>
    <div class="content">
      <div class="title">${esc(w.title)}</div>
      ${w.note ? `<div class="note">${esc(w.note)}</div>` : ''}
      <div class="price">${fmtPrice(w.price)}</div>
      ${w.link ? `<a class="link" href="${esc(w.link)}" target="_blank" rel="noopener">Zum Shop →</a>` : ''}
      ${res}
      <div class="com-toggle" onclick="toggleCom('${ck}')">💬 Kommentare${w.coms.length ? ' (' + w.coms.length + ')' : ''}</div>
      <div class="com-section${openCom[ck] ? ' show' : ''}">${coms}
        <div class="com-form">
          <select id="cn-${ck}"><option value="">-- Wähle deinen Namen --</option>${names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
          <textarea id="ct-${ck}" placeholder="Dein Kommentar..."></textarea>
          <button class="btn" onclick="addCom(${L.id},${w.id})">Kommentar senden</button>
        </div>
      </div>
      <button class="btn" onclick="openRes(${L.id},${w.id})" ${sold ? 'disabled' : ''}>${sold ? 'Bereits vorgemerkt' : 'Vormerken'}</button>
    </div>
  </div>`;
}

function toggleCom(ck) { openCom[ck] = !openCom[ck]; renderContent(); }

function addCom(lid, wid) {
  const ck = lid + '-' + wid, name = $('cn-' + ck).value, text = $('ct-' + ck).value.trim();
  if (!name) { alert('⚠️ Bitte wähle zuerst deinen Namen aus der Liste aus.'); $('cn-' + ck).focus(); return; }
  if (!text) { alert('⚠️ Bitte gib einen Kommentar ein.'); $('ct-' + ck).focus(); return; }
  const w = lists.find(l => l.id === lid).wishes.find(x => x.id === wid);
  w.coms.push({ author: name, text });
  openCom[ck] = true; save(); render();
}

/* ===================== Vormerken ===================== */
function openRes(lid, wid) {
  resTarget = { lid, wid };
  const w = lists.find(l => l.id === lid).wishes.find(x => x.id === wid);
  $('resName').innerHTML = '<option value="">-- Bitte wählen --</option>' + names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  const box = $('detailBox');
  if (w.multi) {
    const taken = w.res.map(r => r.detail);
    const free = w.multiOptions.filter(o => !taken.includes(o));
    let h = '<label>Was schenkst du konkret?</label>';
    if (free.length) {
      h += `<label class="radio-row"><input type="radio" name="detailMode" value="list" checked onchange="toggleDetailMode()"><span>Aus der Liste wählen</span></label>
        <select id="detailList"><option value="">-- Bitte wählen --</option>${free.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
        <label class="radio-row"><input type="radio" name="detailMode" value="text" onchange="toggleDetailMode()"><span>Eigene Eingabe</span></label>
        <input type="text" id="detailText" style="display:none" placeholder="z. B. Brauner Teddy, 30 cm">`;
    } else {
      h += '<input type="text" id="detailText" placeholder="z. B. Brauner Teddy, 30 cm">';
    }
    box.innerHTML = h; box.style.display = 'block';
  } else { box.innerHTML = ''; box.style.display = 'none'; }
  $('resErr').style.display = 'none';
  $('resModal').classList.add('show');
}
function toggleDetailMode() {
  const mode = document.querySelector('input[name="detailMode"]:checked').value;
  $('detailList').style.display = mode === 'list' ? 'block' : 'none';
  $('detailText').style.display = mode === 'text' ? 'block' : 'none';
}
function closeRes() { $('resModal').classList.remove('show'); resTarget = null; }

function confirmRes() {
  const err = m => { $('resErr').textContent = '⚠️ ' + m; $('resErr').style.display = 'block'; };
  const name = $('resName').value;
  if (!name) return err('Bitte wähle deinen Namen aus.');
  const w = lists.find(l => l.id === resTarget.lid).wishes.find(x => x.id === resTarget.wid);
  let detail = '';
  if (w.multi) {
    const mode = document.querySelector('input[name="detailMode"]:checked');
    detail = (mode && mode.value === 'list') ? $('detailList').value : ($('detailText') ? $('detailText').value.trim() : '');
    if (!detail) return err('Bitte gib an, was du konkret schenken möchtest.');
  }
  if (!w.multi && w.res.length) return err('Dieser Wunsch wurde gerade von jemand anderem vorgemerkt.');
  w.res.push({ name, detail, sid });
  save(); render(); closeRes();
}

function unreserve(lid, wid, i) {
  const w = lists.find(l => l.id === lid).wishes.find(x => x.id === wid);
  const r = w.res[i];
  if (!r || !(isAdmin || r.sid === sid)) return;
  if (!confirm(`Vormerkung von "${r.name}" wirklich aufheben?`)) return;
  w.res.splice(i, 1); save(); render();
}

/* ===================== Admin ===================== */
function gearClick() {
  if (isAdmin) { $('admin').scrollIntoView({ behavior: 'smooth' }); return; }
  $('pw').value = ''; $('pwErr').style.display = 'none'; $('pwModal').classList.add('show'); $('pw').focus();
}
function closePw() { $('pwModal').classList.remove('show'); }
async function checkPw() {
  if (await hashPassword($('pw').value) === PW_HASH) {
    isAdmin = true; closePw(); $('admin').classList.add('show'); render(); $('admin').scrollIntoView({ behavior: 'smooth' });
  } else { $('pwErr').style.display = 'block'; $('pw').value = ''; }
}

function renderAdmin() {
  $('adminLists').innerHTML = lists.map(l => `<div class="row row-col">
      <input type="text" id="ln-${l.id}" value="${esc(l.name)}" placeholder="Name">
      <textarea id="li-${l.id}" placeholder="Intro-Text">${esc(l.intro)}</textarea>
      <div style="display:flex;gap:8px"><button class="btn btn-inline" onclick="updateList(${l.id})">Speichern</button><button class="btn btn-del btn-inline" onclick="delList(${l.id})">Löschen</button></div>
    </div>`).join('');

  const L = curList();
  $('adminWishes').innerHTML = (L && L.wishes.length) ? L.wishes.slice().sort(byPrice).map(w => `<div class="row">
      <span><strong>${esc(w.title)}</strong> – ${fmtPrice(w.price)}${w.multi ? ' <em>(Mehrfach)</em>' : ''} <small>[${CATS[getCat(w)].l}]</small></span>
      <span style="display:flex;gap:8px"><button class="btn btn-inline" onclick="editWish(${w.id})">Bearbeiten</button><button class="btn btn-del btn-inline" onclick="delWish(${w.id})">Löschen</button></span>
    </div>`).join('') : '<p style="color:#6a7a6a">Noch keine Wünsche vorhanden.</p>';

  $('adminNames').innerHTML = names.map((n, i) => `<div class="row"><span>${esc(n)}</span><button class="btn btn-del btn-inline" onclick="delName(${i})">Löschen</button></div>`).join('');
}

function addList() {
  const n = $('newListName').value.trim();
  if (!n) { alert('⚠️ Bitte einen Namen eingeben.'); return; }
  lists.push({ id: lists.length ? Math.max(...lists.map(l => l.id)) + 1 : 1, name: n, intro: $('newListIntro').value.trim() || 'Willkommen auf diesem Wunschzettel!', wishes: [] });
  $('newListName').value = ''; $('newListIntro').value = ''; save(); render();
}
function updateList(id) {
  const n = $('ln-' + id).value.trim();
  if (!n) { alert('⚠️ Der Name darf nicht leer sein.'); return; }
  const l = lists.find(x => x.id === id); l.name = n; l.intro = $('li-' + id).value.trim(); save(); render();
}
function delList(id) {
  if (lists.length === 1) { alert('⚠️ Der letzte Wunschzettel kann nicht gelöscht werden.'); return; }
  const l = lists.find(x => x.id === id);
  if (!confirm(`Wunschzettel "${l.name}" samt allen Wünschen löschen?`)) return;
  lists = lists.filter(x => x.id !== id); if (curId === id) curId = lists[0].id; save(); render();
}

function togglePriceVaries() { const v = $('wishPriceVaries').checked; $('wishPrice').disabled = v; if (v) $('wishPrice').value = ''; }
function toggleMultiBox() { $('multiOptionsBox').style.display = $('wishMulti').checked ? 'block' : 'none'; }

function saveWish() {
  const title = $('wishTitle').value.trim(), varies = $('wishPriceVaries').checked;
  const price = varies ? null : parseFloat($('wishPrice').value);
  if (!title) { alert('⚠️ Bitte einen Titel eingeben.'); return; }
  if (!varies && (isNaN(price) || price < 0)) { alert('⚠️ Bitte einen Preis eingeben oder "Preis verschieden" ankreuzen.'); return; }
  const multi = $('wishMulti').checked;
  const data = {
    title, image: $('wishImage').value.trim(), note: $('wishNote').value.trim(), price,
    cat: $('wishCat').value, pri: parseInt($('wishPri').value), link: $('wishLink').value.trim(),
    multi, multiOptions: multi ? $('wishMultiOptions').value.split('\n').map(o => o.trim()).filter(Boolean) : []
  };
  const L = curList(), eid = $('editWishId').value;
  if (eid) Object.assign(L.wishes.find(x => x.id === parseInt(eid)), data);
  else L.wishes.push(Object.assign({ id: L.wishes.length ? Math.max(...L.wishes.map(w => w.id)) + 1 : 1, res: [], coms: [] }, data));
  save(); render(); cancelWish();
}
function editWish(id) {
  const w = curList().wishes.find(x => x.id === id);
  $('editWishId').value = id; $('wishTitle').value = w.title; $('wishImage').value = w.image; $('wishNote').value = w.note;
  $('wishPriceVaries').checked = w.price == null; $('wishPrice').disabled = w.price == null; $('wishPrice').value = w.price == null ? '' : w.price;
  $('wishCat').value = CATS[w.cat] ? w.cat : 'auto'; $('wishPri').value = w.pri || 0; $('wishLink').value = w.link;
  $('wishMulti').checked = w.multi; $('wishMultiOptions').value = w.multiOptions.join('\n'); toggleMultiBox();
  $('wishFormTitle').textContent = 'Wunsch bearbeiten'; $('saveWishBtn').textContent = 'Änderungen speichern'; $('cancelWishBtn').style.display = 'block';
  $('wishFormTitle').scrollIntoView({ behavior: 'smooth' });
}
function cancelWish() {
  ['editWishId', 'wishTitle', 'wishImage', 'wishNote', 'wishPrice', 'wishLink', 'wishMultiOptions'].forEach(i => $(i).value = '');
  $('wishPriceVaries').checked = false; $('wishPrice').disabled = false; $('wishCat').value = 'auto'; $('wishPri').value = '0';
  $('wishMulti').checked = false; toggleMultiBox();
  $('wishFormTitle').textContent = 'Wunsch hinzufügen'; $('saveWishBtn').textContent = 'Wunsch hinzufügen'; $('cancelWishBtn').style.display = 'none';
}
function delWish(id) {
  if (!confirm('Wunsch wirklich löschen?')) return;
  const L = curList(); L.wishes = L.wishes.filter(w => w.id !== id); save(); render();
}

function addName() {
  const n = $('newName').value.trim();
  if (!n) { alert('⚠️ Bitte einen Namen eingeben.'); return; }
  if (names.includes(n)) { alert('⚠️ Dieser Name existiert bereits.'); return; }
  names.push(n); $('newName').value = ''; save(); render();
}
function delName(i) {
  if (!confirm(`"${names[i]}" aus der Namensliste löschen?`)) return;
  names.splice(i, 1); save(); render();
}

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
load();
</script>
</body>
</html>
